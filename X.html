<style id="atsx-account-name-limit">
.atsx-name-overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:99999;padding:20px}
.atsx-name-box{width:min(92vw,420px);background:#130b2d;border:1px solid #6d3bd1;border-radius:18px;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.55)}

.atsx-name-ok{background:#7040d4;color:#fff}
</style>
<div class="atsx-name-overlay" id="atsxNameOverlay">
  <div class="atsx-name-box">
    <div class="atsx-name-title">အကောင့်နာမည်အသစ် ရိုက်ထည့်ပါ</div>
    <input id="atsxNameInput" class="atsx-name-input" type="text" maxlength="20" autocomplete="off">
    <div class="atsx-name-actions">
      <button class="atsx-name-cancel" type="button" id="atsxNameCancel">CANCEL</button>
      <button class="atsx-name-ok" type="button" id="atsxNameOk">OK</button>
    </div>
  </div>
</div>
<script>
(function(){
  const overlay=document.getElementById('atsxNameOverlay');
  const input=document.getElementById('atsxNameInput');
  const cancel=document.getElementById('atsxNameCancel');
  const ok=document.getElementById('atsxNameOk');
  window.atsxAccountNamePrompt=function(currentName){
    input.value=(currentName||'').slice(0,20);
    overlay.style.display='flex';
    setTimeout(()=>{input.focus();input.select()},50);
    return new Promise(resolve=>{
      function done(value){overlay.style.display='none';cleanup();resolve(value)}
      function yes(){done(input.value.trim().slice(0,20)||null)}
      function no(){done(null)}
      function key(e){if(e.key==='Enter'){e.preventDefault();yes()}else if(e.key==='Escape'){e.preventDefault();no()}}
      function cleanup(){ok.removeEventListener('click',yes);cancel.removeEventListener('click',no);input.removeEventListener('keydown',key)}
      ok.addEventListener('click',yes);cancel.addEventListener('click',no);input.addEventListener('keydown',key)
    });
  };
})();
</script>

<script>
// AtsX server sync: keeps Telegram-approved balance/status reflected on this device.
(async function atsxServerSync(){
  try {
    const current = JSON.parse(localStorage.getItem('atsx_current_user') || 'null');
    if (!current || !current.phone) return;
    const r = await fetch('/api/user?phone=' + encodeURIComponent(current.phone), {cache:'no-store'});
    const d = await r.json();
    if (!r.ok || !d.ok || !d.user) return;
    const serverUser = d.user;
    let users = JSON.parse(localStorage.getItem('atsx_users') || '[]');
    const idx = users.findIndex(u => String(u.phone) === String(serverUser.phone) || String(u.id) === String(serverUser.id));
    if (idx >= 0) users[idx] = {...users[idx], ...serverUser}; else users.push(serverUser);
    localStorage.setItem('atsx_users', JSON.stringify(users));
    localStorage.setItem('atsx_current_user', JSON.stringify(serverUser));
    window.dispatchEvent(new Event('storage'));
    if (typeof loadWalletBalance === 'function') loadWalletBalance();
    if (typeof loadAccount === 'function') loadAccount();
  } catch(e) {}
})();
</script>
