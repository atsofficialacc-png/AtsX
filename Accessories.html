<style>
/* General Reset */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #08051f;
    color: #fff;
    font-family: system-ui, -apple-system, sans-serif;
    padding: 16px;
    padding-bottom: 100px;
}

.container {
    max-width: 430px;
    margin: auto;
}

/* Header with Back Button */
.store-header {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 16px;
    padding: 8px 0;
}

.back-btn {
    position: absolute;
    left: 0;
    width: 32px;
    height: 32px;
    background: #1c1047;
    border: 1px solid #2f195f;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    transition: 0.2s;
}

.back-btn:active {
    transform: scale(0.9);
}

.store-title {
    font-size: 16px;
    font-weight: bold;
    color: #a78bfa;
}

/* Products Grid Layout */
.products-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

/* Product Card */
.product-card {
    background: #130a33;
    border: 1px solid #2f195f;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-decoration: none;
    transition: 0.2s;
    cursor: pointer;
}

.product-card:active {
    transform: scale(0.96);
    border-color: #8b5cf6;
}

.product-img-box {
    width: 100%;
    height: 95px;
    background: #1c1047;
    position: relative;
    overflow: hidden;
}

.product-img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.product-info {
    padding: 6px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    flex-grow: 1;
}

.product-name {
    font-size: 10px;
    color: #d1d5db;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 6px;
    line-height: 1.2;
}

.product-price {
    font-size: 11px;
    font-weight: bold;
    color: #fb923c;
}

/* Bottom Navigation */
.bottom-nav-container { 
    position: fixed; 
    bottom: 15px; 
    left: 0; 
    width: 100%; 
    display: flex; 
    justify-content: center; 
    z-index: 9999; 
    padding: 0 12px; 
    pointer-events: none; 
}

.bottom-nav { 
    pointer-events: auto; 
    position: relative; 
    width: 100%; 
    max-width: 430px; 
    height: 68px; 
    background: rgba(20,10,35,.95); 
    backdrop-filter: blur(16px); 
    -webkit-backdrop-filter: blur(16px); 
    border: 1px solid rgba(168,85,247,.35); 
    border-radius: 35px; 
    display: flex; 
    justify-content: space-around; 
    align-items: center; 
    padding: 0 8px; 
    box-shadow: 0 10px 30px rgba(0,0,0,.8),0 0 15px rgba(168,85,247,.2); 
}

.nav-link { 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    color: #9ca3af; 
    text-decoration: none; 
    font-size: 10px; 
    font-weight: 600; 
    flex: 1; 
    transition: all .3s ease; 
    gap: 3px; 
}

.nav-link i { font-size: 18px; }
.nav-link.active { color: #c084fc; }
.nav-link.active i { color: #a855f7; text-shadow: 0 0 10px rgba(168,85,247,.8); }

.center-btn-wrapper { 
    position: relative; 
    top: -22px; 
    flex: 1; 
    display: flex; 
    justify-content: center; 
}

.center-btn { 
    width: 62px; 
    height: 62px;

    border-radius: 50%; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    box-shadow: 0 0 20px rgba(168,85,247,.8); 
    border: 4px solid #0d0614; 
    text-decoration: none; 
    overflow: hidden; 
}

.center-btn img { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    border-radius: 50%; 
}
</style>

<script>
// AtsX server sync: keeps Telegram-approved balance/status reflected on this device.
(async function atsxServerSync(){
  try {
    const current = JSON.parse(localStorage.getItem('atsx_current_user') || 'null');
    if (!current || !current.phone) return;
    const r = await fetch('/api/user?phone=' + encodeURIComponent(current.phone), {cache:'no-store'});
    const d = await r.json();
    if (!r.ok || !d.ok || !d.user) return;
    const serverUser = d.user;
    let users = JSON.parse(localStorage.getItem('atsx_users') || '[]');
    const idx = users.findIndex(u => String(u.phone) === String(serverUser.phone) || String(u.id) === String(serverUser.id));
    if (idx >= 0) users[idx] = {...users[idx], ...serverUser}; else users.push(serverUser);
    localStorage.setItem('atsx_users', JSON.stringify(users));
    localStorage.setItem('atsx_current_user', JSON.stringify(serverUser));
    window.dispatchEvent(new Event('storage'));
    if (typeof loadWalletBalance === 'function') loadWalletBalance();
    if (typeof loadAccount === 'function') loadAccount();
  } catch(e) {}
})();
</script>
